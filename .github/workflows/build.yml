name: Build BudsControl iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build iOS App
        run: |
          xcodebuild -project BudsControl.xcodeproj \
            -scheme BudsControl \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build.log
      
      - name: Package .app
        if: success()
        run: |
          APP_PATH=$(find build -name "BudsControl.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p artifacts
            cp -R "$APP_PATH" artifacts/
            cd artifacts
            zip -r BudsControl-unsigned.ipa BudsControl.app
            echo "✅ Build successful!"
          else
            echo "❌ .app not found"
            exit 1
          fi
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-unsigned
          path: artifacts/BudsControl-unsigned.ipa
          retention-days: 30
      
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
