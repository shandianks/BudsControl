name: Build BudsControl iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build iOS App
        run: |
          set -x
          xcodebuild -project BudsControl.xcodeproj \
            -scheme BudsControl \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build.log
          echo "=== Build completed ==="
          echo "Contents of build directory:"
          ls -la build/ || echo "build/ not found"
          echo "=== Searching for .app ==="
          find build -name "*.app" -type d 2>/dev/null || echo "No .app in build/"
          echo "=== Searching entire workspace ==="
          find . -path "*/Build/Products/*" -name "*.app" -type d 2>/dev/null || echo "No .app in Products"
          find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app anywhere"
      
      - name: Package .app
        if: success()
        run: |
          set -x
          echo "Searching for BudsControl.app..."
          APP_PATH=""
          
          # Try multiple search strategies
          for path in $(find build -name "BudsControl.app" -type d 2>/dev/null); do
            APP_PATH="$path"
            break
          done
          
          if [ -z "$APP_PATH" ]; then
            for path in $(find . -path "*/Build/Products/*" -name "BudsControl.app" -type d 2>/dev/null); do
              APP_PATH="$path"
              break
            done
          fi
          
          if [ -z "$APP_PATH" ]; then
            for path in $(find . -name "BudsControl.app" -type d 2>/dev/null); do
              APP_PATH="$path"
              break
            done
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ BudsControl.app not found anywhere"
            echo "Current directory:"
            pwd
            echo "All directories in build:"
            find build -type d 2>/dev/null | head -50
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          mkdir -p artifacts
          
          # Create proper IPA structure
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cd Payload
          ls -la
          cd ..
          
          zip -r artifacts/BudsControl-unsigned.ipa Payload
          rm -rf Payload
          
          echo "✅ IPA created successfully!"
          ls -lh artifacts/
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-unsigned
          path: artifacts/BudsControl-unsigned.ipa
          retention-days: 30
      
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
