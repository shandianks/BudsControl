name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install xcodegen
      run: |
        brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        xcodegen generate
    
    - name: List source files
      run: |
        echo "=== Source files in project ==="
        ls -la
        echo "=== Contents of BudsControl.xcodeproj ==="
        cat BudsControl.xcodeproj/project.pbxproj | grep -A2 "buildFiles\|PBXSourcesBuildPhase" | head -50
    
    - name: Build iOS App
      run: |
        xcodebuild -project BudsControl.xcodeproj \
          -scheme BudsControl \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -configuration Release \
          build 2>&1 | tee build-output.txt
        BUILD_STATUS=${PIPESTATUS[0]}
        echo "=== Build exit code: $BUILD_STATUS ==="
        echo "=== Searching for .app files ==="
        find . -name "*.app" -type d
        echo "=== Build products directory ==="
        ls -la ~/Library/Developer/Xcode/DerivedData/BudsControl-*/Build/Products/Release-iphonesimulator/ 2>/dev/null || echo "No derived data found"
        echo "=== Build output (last 100 lines) ==="
        tail -100 build-output.txt
        
        # Save errors to file for issue creation
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "BUILD_FAILED" > build-status.txt
          tail -50 build-output.txt > build-errors.txt
        fi
        
        exit $BUILD_STATUS
    
    - name: Package .app
      if: success()
      run: |
        echo "=== Packaging .app ==="
        APP_PATH=$(find . -name "BudsControl.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r BudsControl.ipa Payload
          ls -lh BudsControl.ipa
        else
          echo "ERROR: .app not found, searching more broadly..."
          find ~/Library/Developer/Xcode/DerivedData -name "BudsControl.app" -type d 2>/dev/null
          exit 1
        fi
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BudsControl-unsigned
        path: BudsControl.ipa
        retention-days: 7
    
    - name: Upload Build Output on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: build-output.txt
        retention-days: 1
        if-no-files-found: ignore
    
    - name: Upload Debug Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          ~/Library/Developer/Xcode/DerivedData/BudsControl-*/Build/Products/Release-iphonesimulator/
        retention-days: 1
        if-no-files-found: ignore
    
    - name: Create Issue on Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          let errors = 'Build failed. Check artifacts for details.';
          try {
            errors = fs.readFileSync('build-errors.txt', 'utf8');
          } catch (e) {}
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Build Failed - Run #${{ github.run_number }}`,
            body: `## Build Errors (Run #${{ github.run_number }})
          \n\n\`\`\`
          ${errors}
          \`\`\`
          \n\nCommit: ${{ github.sha }}`
          });
