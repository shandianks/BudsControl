name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install xcodegen
      run: |
        brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        xcodegen generate
    
    - name: Build iOS App
      run: |
        xcodebuild -project BudsControl.xcodeproj \
          -scheme BudsControl \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -configuration Release \
          build
        echo "=== Build exit code: $? ==="
        echo "=== Searching for .app files ==="
        find . -name "*.app" -type d
        echo "=== Build products directory ==="
        ls -la ~/Library/Developer/Xcode/DerivedData/BudsControl-*/Build/Products/Release-iphonesimulator/ 2>/dev/null || echo "No derived data found"
    
    - name: Package .app
      if: success()
      run: |
        echo "=== Packaging .app ==="
        APP_PATH=$(find . -name "BudsControl.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r BudsControl.ipa Payload
          ls -lh BudsControl.ipa
        else
          echo "ERROR: .app not found, searching more broadly..."
          find ~/Library/Developer/Xcode/DerivedData -name "BudsControl.app" -type d 2>/dev/null
          exit 1
        fi
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BudsControl-unsigned
        path: BudsControl.ipa
        retention-days: 7
    
    - name: Upload Debug Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          build-output.txt
          ~/Library/Developer/Xcode/DerivedData/BudsControl-*/Build/Products/Release-iphonesimulator/
        retention-days: 1
        if-no-files-found: ignore
