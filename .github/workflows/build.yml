name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install xcodegen
      run: |
        brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        xcodegen generate
    
    - name: Build iOS App
      run: |
        xcodebuild -project BudsControl.xcodeproj \
          -scheme BudsControl \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -configuration Release \
          build
        echo "Build exit code: $?"
        find . -name "*.app" -type d
    
    - name: Package .app
      if: success()
      run: |
        APP_PATH=$(find . -name "BudsControl.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r BudsControl.ipa Payload
          ls -lh BudsControl.ipa
        else
          echo "ERROR: .app not found"
          exit 1
        fi
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BudsControl-unsigned
        path: BudsControl.ipa
        retention-days: 7
