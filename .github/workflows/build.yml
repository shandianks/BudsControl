name: Build BudsControl iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Install xcodegen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: xcodegen generate
      
      - name: Build iOS App
        run: |
          set -euo pipefail
          xcodebuild -project BudsControl.xcodeproj \
            -scheme BudsControl \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log
          echo "=== Build succeeded ==="
          echo "Searching for .app..."
          find build -name "*.app" -type d 2>/dev/null || echo "No .app in build/"
          find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app anywhere"
      
      - name: Package .app
        if: success()
        run: |
          set -x
          APP_PATH=$(find build -name "BudsControl.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "BudsControl.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ BudsControl.app not found"
            exit 1
          fi
          echo "✅ Found app at: $APP_PATH"
          echo "App size:"
          du -sh "$APP_PATH"
          mkdir -p artifacts
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cd Payload
          ls -la
          cd ..
          zip -r artifacts/BudsControl-unsigned.ipa Payload
          rm -rf Payload
          echo "✅ IPA created!"
          ls -lh artifacts/
          echo "IPA size:"
          du -sh artifacts/BudsControl-unsigned.ipa
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-unsigned
          path: artifacts/BudsControl-unsigned.ipa
          retention-days: 30
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
