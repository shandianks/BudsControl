name: Build BudsControl iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build iOS App
        run: |
          xcodebuild -project BudsControl.xcodeproj \
            -scheme BudsControl \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build.log
          echo "---"
          echo "Build output structure:"
          find build -name "*.app" -type d 2>/dev/null || echo "No .app found in build/"
          find build -type d -name "Build" 2>/dev/null | head -5
      
      - name: Package .app
        if: success()
        run: |
          echo "Searching for BudsControl.app..."
          APP_PATH=$(find build -name "BudsControl.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Trying alternative paths..."
            APP_PATH=$(find . -path "*/Build/Products/*" -name "BudsControl.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Listing build directory:"
            ls -la build/ 2>/dev/null || echo "build/ not found"
            find build -type d -maxdepth 4 2>/dev/null | head -30
            echo "❌ .app not found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p artifacts
          cp -R "$APP_PATH" artifacts/
          cd artifacts
          mkdir -p Payload
          cp -R BudsControl.app Payload/
          zip -r BudsControl-unsigned.ipa Payload
          rm -rf Payload
          echo "✅ Build successful!"
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-unsigned
          path: artifacts/BudsControl-unsigned.ipa
          retention-days: 30
      
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
