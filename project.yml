name: BudsControl
targets:
  BudsControl:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BluetoothManager.swift
      - path: BudsControlApp.swift
      - path: ContentView.swift
      - path: Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.BudsControl
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "BudsControl 需要使用蓝牙连接和控制 Galaxy Buds2。"
      INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "BudsControl 需要使用蓝牙连接 Galaxy Buds2。"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: NO
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
